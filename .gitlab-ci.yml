stages:
    - build
    - deploy



# Build STL files
build:
    stage: build
    image: ubuntu:18.04

    before_script:
      - apt-get update -qq
      - apt-get -y -qq install software-properties-common dirmngr apt-transport-https lsb-release ca-certificates python3-pip wget
      - add-apt-repository -y ppa:openscad/releases
      - apt-get update -qq
      - apt-get install -y -qq openscad
      - pip3 install -r requirements.txt
      - wget https://cloud.monostable.co.uk/ninja_hashed -O build_system/ninja_hashed && chmod +x build_system/ninja_hashed

    script:
      # Build STL files with OpenSCAD
      - mkdir -p /root/.local/share
      - ./build.py --hashed --generate-stl-options-json

    artifacts:
      expire_in: 1 week
      name: "${CI_PROJECT_NAME}-${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
      paths:
        - builds/*.stl
        - builds/*.json

    only:
      - tags
      - merge_requests
      - web

    cache:
      # keep a cache named after the job ("build"), this is shared across branches
      # and pull-requests on this repo.
      # see https://docs.gitlab.com/ee/ci/caching/#sharing-caches-across-different-branches
      key: ${CI_JOB_NAME}
      paths:
        - builds/
        - .ninja_*


# Build docs
build-docs:
    stage: build
    image: ubuntu:18.04

    before_script:
      - apt-get update -qq
      - apt-get -y -qq install software-properties-common
      - apt-get -y -qq install git git-lfs

    script:
      # Build documentation
      # TODO: Implement git-building to render .md to .html
      - git lfs install
      - git config --local lfs.fetchexclude "/docs/original_images,/design_files"
      - git lfs fetch
      - git lfs checkout

      - python3 ./build_docs.py

    artifacts:
      expire_in: 1 week
      name: "${CI_PROJECT_NAME}-${CI_JOB_NAME}-${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}-docs"
      paths:
        - builds/

    only:
      - tags
      - merge_requests
      - web


# Deploy to builds.openflexure.org
deploy:
  stage: deploy
  dependencies:
    - build
    - build-docs
  image: ubuntu:latest

  before_script:
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
    - eval $(ssh-agent -s)
    - ssh-add <(echo "$SSH_PRIVATE_KEY_BATH_OPENFLEXURE_BASE64" | base64 --decode)
    - mkdir -p ~/.ssh
    - echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

  script:
    # Install rsync if not already installed
    - 'which rsync || ( apt-get update -y && apt-get install rsync -y )'

    # remove all the ninja specific files
    - rm -f builds/*.d builds/.ninja_*

    # Upload the builds folder to openflexure-microscope builds
    - rsync -hrvz -e ssh builds/ ci-user@openflexure.bath.ac.uk:/var/www/build/openflexure-microscope/${CI_COMMIT_REF_NAME} --delete

    # Zip the builds folder and upload it to the openflexure-microscope build root
    - 'which zip || ( apt-get update -y && apt-get install zip -y )'
    - (cd builds && zip -r "../${CI_PROJECT_NAME}-${CI_COMMIT_REF_NAME}.zip" .)
    - rsync -hrvz -e ssh "${CI_PROJECT_NAME}-${CI_COMMIT_REF_NAME}.zip" ci-user@openflexure.bath.ac.uk:/var/www/build/openflexure-microscope/

    # Run update-latest.py on the build server
    - ssh -t ci-user@openflexure.bath.ac.uk "/var/www/build/update-latest.py"

  only:
    - tags
    - web
